name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  unit:
    name: Unit suite (${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install plugin dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt || true
          # core deps used by the plugin (match the Hermes runtime versions loosely)
          pip install "openai>=1.30" "pyyaml>=6.0" pytest

      - name: Hermetic environment (no provider keys in CI)
        run: |
          # Guard: CI must never hold real keys. The suite is fully mocked;
          # these placeholders exercise the placeholder-detection path too.
          echo "NOUS_API_KEY=sk-ci-placeholder" >> $GITHUB_ENV
          echo "OPENROUTER_API_KEY=sk-ci-placeholder" >> $GITHUB_ENV
          echo "HERMES_WRITE_SAFE_ROOT=${{ github.workspace }}" >> $GITHUB_ENV

      - name: Run unit suite
        run: python -m pytest tests/ -q --tb=short

      - name: Import sanity (no import-time side effects)
        run: |
          python -c "import sys; sys.path.insert(0,'.'); sys.path.insert(0,'..'); import hermes_router; print('import OK')"

  clean-install:
    name: Clean-install check (plugin.yaml valid, no stray artifacts)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate plugin.yaml parses
        run: python -c "import yaml; yaml.safe_load(open('plugin.yaml')); print('plugin.yaml OK')"
      - name: Validate CHANGELOG has entry for current version
        run: |
          python - <<'PY'
          import yaml, re
          ver = yaml.safe_load(open("plugin.yaml"))["version"]
          ch = open("CHANGELOG.md").read()
          assert re.search(r"^## %s\b" % re.escape(ver), ch, re.M), \
              "CHANGELOG.md missing an entry for version %s" % ver
          print("CHANGELOG covers %s OK" % ver)
          PY
      - name: No backup artifacts committed
        run: |
          ! find . -name "*.bak*" -o -name "*.orig" -o -name "*~" | grep -q .
      - name: No committed secrets
        run: |
          # cheap heuristic gate; real scanning is the maintainer's job
          ! grep -rInE "sk-or-v1-[0-9a-f]{20,}|sk-proj-[A-Za-z0-9]{20,}|AKIA[0-9A-Z]{16}" --include="*.py" --include="*.yaml" --include="*.md" . | grep -q .
